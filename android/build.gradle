group 'com.flutterplaza.no_screenshot'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.1.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

// AGP 9+ ships built-in Kotlin support and no longer allows applying the
// Kotlin Gradle Plugin; only apply it on older AGP versions. See
// https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin/for-plugin-authors
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
if (agpMajor < 9) {
    apply plugin: 'kotlin-android'
}

android {
    namespace "com.flutterplaza.no_screenshot"
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // NOTE: do not add src/main/kotlin to sourceSets here — the Kotlin
    // toolchain (KGP, and AGP's built-in Kotlin on 9+) already compiles it,
    // and registering it again compiles every declaration twice
    // ("Conflicting declarations" on Flutter >= 3.44.4, see #114).

    defaultConfig {
        minSdkVersion 16
    }
}

// The kotlin {} extension exists on both paths: registered by KGP on
// AGP < 9 and by AGP's built-in Kotlin on 9+. The compilerOptions DSL
// requires KGP >= 1.9; fine here since the plugin's minimum Flutter
// (3.38) ships KGP 2.x.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
}
